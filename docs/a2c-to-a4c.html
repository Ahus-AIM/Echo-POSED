<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Guidance example</title>
<style>
:root {
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(24 24 24));
  --foreground: light-dark(rgb(26 28 31), rgb(255 255 255));
  --muted-foreground: light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%));
  --border: light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%));
  --viz-series-1: light-dark(rgb(51 156 255), rgb(131 195 255));
  --viz-series-2: light-dark(rgb(243 136 59), rgb(245 154 86));
  --font-sans: -apple-system-body, ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-size-base: 16px;
  --font-size-normal: 16px;
  --font-size-small: 14px;
  background: var(--background);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 1rem;
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: 26px;
  -webkit-font-smoothing: antialiased;
}
h3, p { margin-block: 0; }
svg { display: block; max-width: 100%; height: auto; }
.text-small { font-size: var(--font-size-small); line-height: 18px; }
#posed-guidance-demo {
  --posed-current: var(--viz-series-1);
  --posed-target: var(--viz-series-2);
  --posed-gap: var(--font-size-base);
  --posed-cell: clamp(40px, calc(5.6vw - 1.8px), 48px);
  max-width: 1120px;
  margin-inline: auto;
  display: grid;
  gap: var(--posed-gap);
}
#posed-guidance-demo h3 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-height: 2em;
  margin: 0;
  font-size: calc(1.2 * var(--font-size-base));
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
}
/* x and x-dagger have boxes of different height: bottom alignment keeps their baselines level. */
#posed-guidance-demo .posed-layout h3 { align-items: flex-end; box-sizing: border-box; height: 2em; padding-bottom: .3em; }
#posed-guidance-demo .posed-view h3 math { position: relative; top: -.33em; }
#posed-guidance-demo .posed-view .posed-swatch { margin-bottom: .64em; }
/* Both rows share these two columns, so the calculation lines up with the views above it. */
#posed-guidance-demo .posed-layout,
#posed-guidance-demo .posed-calc-body {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: calc(1.5 * var(--posed-gap));
  row-gap: var(--posed-gap);
}
#posed-guidance-demo .posed-views {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: var(--posed-gap);
}
#posed-guidance-demo .posed-view,
#posed-guidance-demo .posed-rotation {
  min-width: 0;
  display: grid;
  gap: calc(.25 * var(--posed-gap));
}
#posed-guidance-demo .posed-rotation { grid-template-rows: auto minmax(0, 1fr); }
#posed-guidance-demo img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 4px;
}
#posed-guidance-demo .posed-swatch { width: 1em; border-top: 2px solid var(--posed-current); }
#posed-guidance-demo .posed-swatch.target { border-top: 2px dashed var(--posed-target); }
#posed-guidance-demo .posed-prediction {
  display: grid;
  place-items: center;
  min-height: 2em;
  margin: 0 0 calc(.35 * var(--posed-gap));
}
#posed-guidance-demo .posed-matrix {
  border-spacing: 2px;
  table-layout: fixed;
  width: calc(3 * var(--posed-cell) + 8px);
  color: var(--foreground);
  font-family: var(--font-mono);
  /* five monospace characters, such as -0.76, always fit inside one cell */
  font-size: min(var(--font-size-small), calc((var(--posed-cell) - 6px) / 3.1));
  font-variant-numeric: tabular-nums;
  margin: 0 auto;
}
#posed-guidance-demo .posed-matrix caption {
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  line-height: 2.4;
  white-space: nowrap;
}
#posed-guidance-demo .posed-matrix td {
  box-sizing: border-box;
  width: var(--posed-cell);
  height: var(--posed-cell);
  padding: 0;
  text-align: center;
  white-space: nowrap;
  border-radius: 2px;
}
#posed-guidance-demo .posed-stage { position: relative; min-height: 280px; }
#posed-guidance-demo .posed-scene {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}
#posed-guidance-demo .posed-axes text {
  paint-order: stroke;
  stroke: var(--background);
  stroke-width: 3px;
  stroke-linejoin: round;
}
#posed-guidance-demo .posed-calculation {
  display: grid;
  gap: calc(.35 * var(--posed-gap));
  border-top: 1px solid var(--border);
  padding-top: calc(.75 * var(--posed-gap));
}
#posed-guidance-demo .posed-calc-body { align-items: end; }
#posed-guidance-demo .posed-equation-frame { container-type: inline-size; min-width: 0; }
#posed-guidance-demo .posed-equation {
  /* nine cells, two operators and the gaps share the column width */
  --posed-cell: min(48px, calc((100cqw - 84px) / 9));
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  gap: 8px;
}
#posed-guidance-demo .posed-equation .posed-matrix { margin: 0; }
#posed-guidance-demo .posed-result { display: flex; align-items: flex-end; gap: 8px; }
#posed-guidance-demo .posed-operator,
#posed-guidance-demo .posed-recommendation {
  /* centred on the matrix cells, not on the captions */
  display: flex;
  align-items: center;
  justify-content: center;
  height: calc(3 * var(--posed-cell) + 8px);
}
#posed-guidance-demo .posed-operator { width: 14px; font-size: 1.3em; }
#posed-guidance-demo .posed-recommendation {
  --posed-cell: 48px;
  margin: 0;
  font-size: 1.25em;
  text-align: center;
  text-wrap: balance;
}
#posed-guidance-demo .posed-attribution {
  margin: 0;
  color: var(--muted-foreground);
  font-size: var(--font-size-small);
  text-align: center;
}
@media (max-width: 972px) {
  #posed-guidance-demo { --posed-cell: 48px; }
  #posed-guidance-demo .posed-layout,
  #posed-guidance-demo .posed-calc-body { grid-template-columns: minmax(0, 1fr); }
  #posed-guidance-demo img { max-height: 14rem; }
  #posed-guidance-demo .posed-stage { height: 320px; }
  #posed-guidance-demo .posed-recommendation { height: auto; min-height: 2.5em; }
}
@media (max-width: 552px) {
  #posed-guidance-demo { --posed-cell: clamp(36px, calc(12vw - 3.84px), 46px); }
  #posed-guidance-demo .posed-views { gap: .5em; }
  #posed-guidance-demo .posed-view .posed-prediction { font-size: .9em; }
  #posed-guidance-demo .posed-stage { height: 290px; }
  /* current times target on one line, the result centred underneath */
  #posed-guidance-demo .posed-equation { --posed-cell: clamp(36px, calc((100cqw - 48px) / 6), 44px); }
  #posed-guidance-demo .posed-result { flex-basis: 100%; justify-content: center; padding-right: 22px; }
}

</style>
</head>

  <script>
    (() => {
      const root = document.getElementById("posed-guidance-demo");
      const data = JSON.parse(document.getElementById("posed-guidance-data").textContent);
      const svg = root.querySelector(".posed-scene");
      const marks = svg.querySelector("[data-geometry]");
      const svgNS = "http://www.w3.org/2000/svg";
      const current = "var(--posed-current)";
      const target = "var(--posed-target)";
      const neutral = "var(--muted-foreground)";
      const axisInk = "var(--foreground)";

      const dot = (a, b) => a.reduce((sum, value, i) => sum + value * b[i], 0);
      const transpose = (matrix) => matrix[0].map((_, column) => matrix.map((row) => row[column]));
      function multiply(left, right) {
        const columns = transpose(right);
        return left.map((row) => columns.map((column) => dot(row, column)));
      }

      // Apply the recommendation on the right of the current rotation.
      const currentTranspose = transpose(data.current);
      const recommendation = multiply(currentTranspose, data.target);
      const matrices = {current: data.current, target: data.target, currentTranspose, recommendation};

      const rgb = (hex) => [1, 3, 5].map((offset) => parseInt(hex.slice(offset, offset + 2), 16) / 255);
      const linear = (channel) => channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4;
      const color = (value) => data.coolwarm[Math.round((Math.max(-1, Math.min(1, value)) + 1) * 128)];
      root.querySelectorAll("[data-matrix]").forEach((table) => {
        const body = table.createTBody();
        for (const row of matrices[table.dataset.matrix]) {
          const line = body.insertRow();
          for (const value of row) {
            const cell = line.insertCell();
            const background = color(value);
            const luminance = dot(rgb(background).map(linear), [.2126, .7152, .0722]);
            cell.style.backgroundColor = background;
            cell.style.color = luminance > .179 ? "#000" : "#fff";
            cell.dataset.value = value;
            cell.textContent = Math.abs(value) < .005 ? "0.00" : value.toFixed(2).replace("-", "−");
          }
        }
      });

      const axialDegrees = Math.atan2(recommendation[1][0], recommendation[0][0]) * 180 / Math.PI;
      const direction = axialDegrees < 0 ? "clockwise" : "counterclockwise";
      root.querySelector("[data-recommendation]").textContent =
        "Rotate probe " + Math.round(Math.abs(axialDegrees)) + "° " + direction + " around z";

      const skew = [
        recommendation[2][1] - recommendation[1][2],
        recommendation[0][2] - recommendation[2][0],
        recommendation[1][0] - recommendation[0][1]
      ];
      const skewNorm = Math.hypot(...skew);
      const axis = skew.map((value) => value / skewNorm);
      const trace = recommendation[0][0] + recommendation[1][1] + recommendation[2][2];
      const radians = Math.atan2(skewNorm, trace - 1);
      function turn(radians) {
        const [x, y, z] = axis;
        const cross = [[0, -z, y], [z, 0, -x], [-y, x, 0]];
        const sine = Math.sin(radians);
        const cosine = Math.cos(radians);
        return axis.map((a, row) => axis.map((b, column) =>
          (row === column ? cosine : 0) + sine * cross[row][column] + (1 - cosine) * a * b
        ));
      }

      const radius = data.depth / 2;
      const tip = [0, 0, -radius];
      const halfAngle = data.width * Math.PI / 360;
      const add = (a, b, scale) => a.map((value, i) => value + scale * b[i]);
      const lengths = [.31, .29, .41].map((v) => v * data.depth);
      const steps = 60;
      let step = 0;
      // Probe cross sections from the acoustic face to the end of the handle.
      const profile = [
        [0, .10, .042], [.018, .12, .054], [.058, .12, .056],
        [.120, .076, .045], [.186, .045, .036], [.241, .036, .031],
        [.254, .029, .025],
      ];
      const sides = 12;
      const states = Array.from({length: steps + 1}, (_, step) => {
        const axes = transpose(multiply(data.current, turn(step * radians / steps)));
        const sector = [tip];
        for (let i = 0; i <= 42; i++) {
          const direction = halfAngle * (2 * i / 42 - 1);
          sector.push(add(add(tip, axes[0], data.depth * Math.sin(direction)),
            axes[2], data.depth * Math.cos(direction)));
        }
        const rings = profile.map(([offset, width, thickness]) => {
          const center = add(tip, axes[2], -offset * data.depth);
          return Array.from({length: sides}, (_, side) => {
            const theta = 2 * Math.PI * side / sides;
            return add(add(center, axes[0], data.depth * width * Math.cos(theta)),
              axes[1], data.depth * thickness * Math.sin(theta));
          });
        });
        return {axes, sector, rings};
      });

      const yaw = .22;
      const pitch = .39;
      const right = [Math.cos(yaw), Math.sin(yaw), 0];
      const down = [-Math.sin(yaw) * Math.sin(pitch), Math.cos(yaw) * Math.sin(pitch), Math.cos(pitch)];
      const away = [Math.sin(yaw) * Math.cos(pitch), -Math.cos(yaw) * Math.cos(pitch), Math.sin(pitch)];
      const camera = (point) => [dot(point, right), dot(point, down)];
      const projected = [
        [-radius, -radius], [radius, radius],
        ...states.flatMap(({axes, sector, rings}) => [
          ...sector.map(camera),
          ...rings.flat().map(camera),
          ...axes.map((direction, i) => camera(add(tip, direction, lengths[i])))
        ])
      ];
      const bounds = [0, 1].map((i) => [Math.min(...projected.map((p) => p[i])), Math.max(...projected.map((p) => p[i]))]);

      function mark(tag, attrs, parent = marks) {
        const node = document.createElementNS(svgNS, tag);
        for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
        parent.append(node);
        return node;
      }

      function drawProbe({rings}, outline) {
        const probe = mark("g", {"data-probe": ""});
        const faces = rings.slice(1).flatMap((upper, i) => rings[i].map((point, j) => {
          const next = (j + 1) % sides;
          const shade = 22 + 26 * (0.5 + 0.5 * Math.cos((j + 0.5) * 2 * Math.PI / sides));
          return {points: [point, rings[i][next], upper[next], upper[j]], shade};
        }));
        faces.push({points: rings[0], shade: 68}, {points: rings.at(-1), shade: 35});
        const depth = ({points}) => points.reduce((sum, point) => sum + dot(point, away), 0) / points.length;
        faces.sort((a, b) => depth(b) - depth(a));
        for (const {points, shade} of faces) {
          const fill = "color-mix(in srgb, var(--foreground) " + shade + "%, var(--background))";
          mark("path", {d: outline(points) + "Z", fill, stroke: fill, "stroke-width": .7}, probe);
        }
      }

      function draw() {
        const width = svg.clientWidth;
        const height = svg.clientHeight;
        if (width < 80 || height < 80) return;
        const scale = Math.min((width - 44) / (bounds[0][1] - bounds[0][0]), (height - 44) / (bounds[1][1] - bounds[1][0]));
        const cx = (width - scale * (bounds[0][0] + bounds[0][1])) / 2;
        const cy = (height - scale * (bounds[1][0] + bounds[1][1])) / 2;
        const xy = (point) => {
          const [x, y] = camera(point);
          return [cx + scale * x, cy + scale * y];
        };
        const outline = (points) => "M" + points.map((p) => xy(p).map((v) => v.toFixed(2)).join(",")).join("L");
        svg.setAttribute("viewBox", [0, 0, width, height].join(" "));
        marks.replaceChildren();

        mark("circle", {cx, cy, r: scale * radius, fill: neutral, "fill-opacity": .055,
          stroke: neutral, "stroke-opacity": .55});
        for (let i = 0; i < 2; i++) {
          const points = Array.from({length: 73}, (_, j) => {
            const theta = j * Math.PI / 36;
            const point = [0, 0, 0];
            point[(i + 1) % 3] = radius * Math.cos(theta);
            point[(i + 2) % 3] = radius * Math.sin(theta);
            return point;
          });
          mark("path", {d: outline(points), fill: "none", stroke: neutral,
            "stroke-opacity": .35, "stroke-dasharray": "3 3"});
        }

        if (step > 0) {
          mark("path", {d: outline(states[0].sector) + "Z", fill: "none", stroke: current, "stroke-opacity": .38});
        }
        mark("path", {d: outline(states[steps].sector) + "Z", fill: target, "fill-opacity": .08,
          stroke: target, "stroke-dasharray": "5 4", "data-target-sector": ""});
        const activeColor = step === steps ? target : current;
        mark("path", {d: outline(states[step].sector) + "Z", stroke: activeColor, "stroke-width": 1.55,
          fill: activeColor, "fill-opacity": .14, "data-active-sector": ""});
        drawProbe(states[step], outline);

        const [x, y] = xy(tip);
        const axes = mark("g", {class: "posed-axes"});
        for (let i = 0; i < 3; i++) {
          const [ex, ey] = xy(add(tip, states[step].axes[i], lengths[i]));
          const length = Math.hypot(ex - x, ey - y);
          if (length < 2) continue;
          const u = [(ex - x) / length, (ey - y) / length];
          const [hx, hy] = [ex - 6 * u[0], ey - 6 * u[1]];
          const arrow = ["M", hx - 3 * u[1], hy + 3 * u[0], "L", ex, ey,
            "L", hx + 3 * u[1], hy - 3 * u[0]].join(" ");
          mark("line", {x1: x, y1: y, x2: ex, y2: ey, stroke: axisInk, "stroke-width": 1.5}, axes);
          mark("path", {d: arrow, fill: "none", stroke: axisInk, "stroke-width": 1.3}, axes);
          const label = mark("text", {x: ex + 11 * u[0], y: ey + 11 * u[1] + 4,
            fill: axisInk, "text-anchor": "middle", class: "text-small"}, axes);
          label.textContent = "xyz"[i];
        }
      }

      new ResizeObserver(draw).observe(svg);
      draw();
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        let start;
        function animate(now) {
          start ??= now;
          const progress = Math.max(0, Math.min(1, (now - start - 650) / 1800));
          const next = Math.round(progress * steps);
          if (next !== step) {
            step = next;
            draw();
          }
          if (progress < 1) requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }
    })();
  </script>
</div>
</body>
</html>
